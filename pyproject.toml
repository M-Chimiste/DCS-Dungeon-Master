[project]
name = "dcs-dungeon-master"
version = "0.1.0"
description = "Python backend for the DCS Dungeon Master harness."
readme = "project-docs/PRD.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "DCS Dungeon Master Contributors" }
]
dependencies = [
  "grpcio>=1.71.0,<2",
  "httpx>=0.28.0,<1",
  "protobuf>=5.29.0,<6",
]

[dependency-groups]
dev = [
  "grpcio-tools>=1.71.0,<2",
  "pytest>=8.4.0,<9",
]

[project.scripts]
dcs-dungeon-master = "dcs_dungeon_master.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_dungeon_master", "src/dcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
