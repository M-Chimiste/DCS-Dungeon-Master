[project]
name = "dcs-dungeon-master"
version = "0.1.0"
description = "Milestone 0 backend skeleton for the DCS Dungeon Master harness."
readme = "project-docs/PRD.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "DCS Dungeon Master Contributors" }
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
]

[project.scripts]
dcs-dungeon-master = "dcs_dungeon_master.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_dungeon_master"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
